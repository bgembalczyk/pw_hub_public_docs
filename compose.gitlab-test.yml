# Docker Compose override file for GitLab CI testing
# This file adds services and overrides configurations needed for CI/CD pipeline

services:
  django:
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    environment:
      # Override for CI environment
      # Use POSTGRES_* variables to override values from env_file
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      # REDIS_URL is used for caching (see config/settings/base.py)
      - REDIS_URL=${CELERY_BROKER_URL}
    depends_on:
      - postgres
      - redis

  postgres:
    environment:
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  redis:
    # Using Redis 6 to match production environment (see docker-compose.production.yml)
    image: docker.io/redis:6
    container_name: pw_hub_test_redis
